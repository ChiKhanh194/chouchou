<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE3EE; --dot:#FFB9D3; --ink:#3B1F4F; --muted:#7B5590; --line:#3B1F4F; --card:#FFFFFF;
  --pink:#FF6F9F; --lav:#B7A0FF; --lemon:#FFDC6B; --mint:#7FDCC0; --onacc:#3B1F4F;
  --head:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2A1440;--dot:#3F2360;--ink:#FFEAF3;--muted:#D2B8E6;--line:#12061E;--card:#3B2158}
}
:root[data-theme="dark"]{--bg:#2A1440;--dot:#3F2360;--ink:#FFEAF3;--muted:#D2B8E6;--line:#12061E;--card:#3B2158}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);
  background-size:34px 34px;
  color:var(--ink);font-family:var(--body);font-weight:600;font-size:1.05rem;line-height:1.5;
  overflow-x:hidden;
}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

h1,h2{
  font-family:var(--head);font-weight:800;line-height:1.1;margin:0 0 .4rem;
  font-size:clamp(2rem,8vw,3.2rem);text-wrap:balance;max-width:18ch;
}
h1:focus,h2:focus{outline:none}
.hint{margin:0 0 1.4rem;color:var(--muted);max-width:32ch;text-wrap:balance}

.stage{
  display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:100svh;padding:76px 20px 36px;
}
.stage.active{display:flex;animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

.btn,.chip{
  font-family:var(--head);font-weight:800;color:var(--onacc);cursor:pointer;
  border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--line);
  transition:transform .12s,box-shadow .12s;
}
.btn{background:var(--lemon);font-size:1.15rem;padding:.6rem 1.5rem}
.btn.alt{background:var(--mint)}
.btn:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip{
  position:fixed;z-index:60;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);
  background:var(--card);color:var(--ink);font-size:.95rem;padding:.3rem .9rem;
}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;margin-top:.9rem}
:focus-visible{outline:4px solid var(--lav);outline-offset:3px}

/* ---------- Gift ---------- */
.gift{
  position:relative;width:190px;height:210px;background:none;border:0;padding:0;cursor:pointer;
  transform-origin:50% 100%;animation:wig 2.4s ease-in-out infinite;
}
.gift .box{
  position:absolute;left:14px;right:14px;bottom:0;height:128px;background:var(--pink);
  border:4px solid var(--line);border-radius:14px;overflow:hidden;
}
.gift .box::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:34px;margin-left:-17px;
  background:var(--lemon);border-inline:4px solid var(--line);
}
.gift .lid{
  position:absolute;left:0;right:0;bottom:118px;height:56px;background:var(--pink);
  border:4px solid var(--line);border-radius:14px;
  transition:transform .8s cubic-bezier(.3,1.6,.5,1),opacity .4s .5s;
}
.gift .lid::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:34px;margin-left:-17px;
  background:var(--lemon);border-inline:4px solid var(--line);
}
.bow{position:absolute;left:50%;top:-36px;width:80px;height:36px;margin-left:-40px}
.bow::before,.bow::after{
  content:'';position:absolute;top:0;width:36px;height:32px;background:var(--lemon);border:4px solid var(--line);
}
.bow::before{left:0;border-radius:50% 50% 50% 8%;transform:rotate(-14deg)}
.bow::after{right:0;border-radius:50% 50% 8% 50%;transform:rotate(14deg)}
.gift.open{animation:none}
.gift.open .lid{transform:translateY(-150px) rotate(-16deg);opacity:0}
@keyframes wig{
  0%,58%,100%{transform:rotate(0)}
  66%{transform:rotate(-6deg)}74%{transform:rotate(6deg)}
  82%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}
}

/* ---------- Cake ---------- */
.cake{width:min(86vw,340px);height:auto;overflow:visible}
.ol{stroke:var(--line);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.candle{cursor:pointer;outline:none}
.candle:focus-visible .wick{stroke:var(--lav);stroke-width:7}
.flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0;transition:transform .25s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.candle.lit .flame{transform:scale(1);opacity:1;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
.pill{
  display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:999px;
  padding:.15rem 1rem;font-family:var(--head);font-weight:800;margin:.6rem 0 1rem;
}
.actions{display:flex;flex-direction:column;align-items:center}

/* ---------- Balloons ---------- */
.sky{position:relative;width:min(100%,460px);height:210px;margin:4px auto 0}
.balloon{
  position:absolute;width:64px;height:78px;padding:0;cursor:pointer;
  border:4px solid var(--line);border-radius:50% 50% 46% 46%/55% 55% 45% 45%;
  font-family:var(--head);font-weight:800;font-size:1.6rem;color:#fff;
  animation:bob 3s ease-in-out infinite alternate;
}
.balloon::before{content:'';position:absolute;left:12px;top:10px;width:12px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(20deg)}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:4px;height:46px;margin-left:-2px;background:var(--line);border-radius:2px}
.balloon.popped{animation:none;transform:scale(1.5);opacity:0;pointer-events:none;transition:transform .15s,opacity .15s}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}

.wishes{list-style:none;margin:0;padding:0;width:min(100%,460px);display:flex;flex-direction:column;gap:10px}
.wish{
  background:var(--card);border:3px solid var(--line);border-left-width:14px;border-radius:16px;
  padding:10px 14px;box-shadow:0 4px 0 var(--line);text-align:left;animation:pop .35s cubic-bezier(.3,1.6,.5,1);
}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* ---------- Final card ---------- */
.card{
  background:var(--card);border:4px solid var(--line);border-radius:22px;padding:28px 22px;
  box-shadow:0 8px 0 var(--line);max-width:520px;transform:rotate(-1.2deg);margin-bottom:1.6rem;
}
.card h2{max-width:none}
.card p{margin:.6rem 0;text-wrap:pretty}
.sign{font-family:var(--head);font-weight:800;font-size:1.2rem}
.secret{margin-top:.8rem;color:var(--pink);font-weight:800}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

@media (prefers-reduced-motion:reduce){
  .gift,.balloon,.candle.lit .flame,.stage.active{animation:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="chip" id="sound" aria-pressed="false">🔈 Bật nhạc</button>

<main>
  <!-- 1. Hộp quà -->
  <section class="stage active" id="s1">
    <h1 id="t1"></h1>
    <p class="hint">Chạm vào hộp quà để mở nhé.</p>
    <button class="gift" id="gift" aria-label="Mở hộp quà">
      <span class="box"></span>
      <span class="lid"><span class="bow"></span></span>
    </button>
  </section>

  <!-- 2. Bánh kem -->
  <section class="stage" id="s2">
    <h2>Thắp nến mauuuu!</h2>
    <p class="hint" id="h2hint">Chạm vào từng cây nến để thắp lên.</p>
    <svg class="cake" viewBox="0 0 320 280" role="img" aria-label="Chiếc bánh kem có 5 cây nến">
      <ellipse class="ol" cx="160" cy="252" rx="140" ry="16" fill="#B7A0FF"/>
      <rect class="ol" x="36" y="172" width="248" height="76" rx="22" fill="#B7A0FF"/>
      <rect class="ol" x="64" y="112" width="192" height="70" rx="20" fill="#FF6F9F"/>
      <path class="ol" d="M64 132 a20 20 0 0 1 20 -20 h152 a20 20 0 0 1 20 20 v6 a10 10 0 0 1 -20 0 v6 a10 10 0 0 1 -20 0 v4 a10 10 0 0 1 -20 0 v-2 a10 10 0 0 1 -20 0 v6 a10 10 0 0 1 -20 0 v-4 a10 10 0 0 1 -20 0 v8 a10 10 0 0 1 -20 0 v-6 a10 10 0 0 1 -20 0 z" fill="#FFFFFF"/>
      <g stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="60" y1="204" x2="70" y2="212" stroke="#FFDC6B"/><line x1="98" y1="222" x2="108" y2="216" stroke="#FF6F9F"/>
        <line x1="140" y1="206" x2="150" y2="214" stroke="#7FDCC0"/><line x1="182" y1="224" x2="192" y2="216" stroke="#FFFFFF"/>
        <line x1="222" y1="204" x2="232" y2="212" stroke="#FFDC6B"/><line x1="254" y1="224" x2="262" y2="216" stroke="#FF6F9F"/>
        <line x1="96" y1="160" x2="106" y2="166" stroke="#FFDC6B"/><line x1="160" y1="164" x2="170" y2="158" stroke="#7FDCC0"/>
        <line x1="214" y1="160" x2="224" y2="166" stroke="#FFFFFF"/>
      </g>
      <g id="candles"></g>
    </svg>
    <div class="pill" id="count" aria-live="polite">Đã thắp 0/5</div>
    <div class="actions" id="blowbox" hidden>
      <button class="btn" id="blow">Ước 1 tỉ điều rồi thổi thổi thổi</button>
      <button class="linkbtn" id="mic">hoặc thổi vào micro</button>
    </div>
  </section>

  <!-- 3. Bóng bay -->
  <section class="stage" id="s3">
    <h2>Lời chúc bay lên rồi!</h2>
    <p class="hint" id="h3hint">Chạm vào bóng bay để đọc lời chúc.</p>
    <div class="sky" id="sky"></div>
    <ul class="wishes" id="wishes"></ul>
    <button class="btn alt" id="next" hidden style="margin-top:1.4rem">Mở thiệp cuối cùng</button>
  </section>

  <!-- 4. Thiệp cuối -->
  <section class="stage" id="s4">
    <div class="card">
      <h2 id="t4"></h2>
      <p id="msg"></p>
      <p class="sign" id="sign"></p>
      <p class="secret" id="secret" hidden></p>
    </div>
    <div class="row">
      <button class="btn" id="again-confetti">Bắn pháo giấy</button>
      <button class="btn alt" id="restart">Xem lại từ đầu</button>
    </div>
  </section>
</main>

<script>
/* ====== CHỈNH Ở ĐÂY ======
   Có thể đổi tên qua link: ?ten=Linh&tu=Nam */
const CONFIG = {
  name: 'Chou',
  from: 'Bạn của bạn',
  wishes: [
    'Chúc em luôn xinh đẹp, rạng rỡ và cười thật nhiều mỗi ngày 🌸',
    'Chúc em ăn no, ngủ kĩ, ví nhìu tiền 💸',
    'Mong mọi dự định của em năm nay đều thành hiện thực ✨',
    'Chúc em gặp thật nhiều người tốt và những điều bất ngờ dễ thương 🍀',
    'Tuổi mới bình yên, vui vẻ, và luôn có người quan trọng ở bên cạnh nhé 🎂'
  ],
  finalMessage: 'Chúc Chou một tuổi mới thật nhiều niềm vui, nhiều tiếng cười, đẳng cấp hơn, bá khí hơn, thi được vào trường mà mình mong muốn nhóe!',
  secret: 'Bí mật nhỏ: bạn là người đặc biệt nhất tuần này 😄'
};

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const NAME = (params.get('ten') || CONFIG.name).slice(0, 40);
const FROM = (params.get('tu') || CONFIG.from).slice(0, 40);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.title = 'Chúc mừng sinh nhật ' + NAME + '!';
$('#t1').textContent = 'Có quà cho ' + NAME + ' nè!';
$('#t4').textContent = 'Chúc mừng sinh nhật, ' + NAME + '!';
$('#msg').textContent = CONFIG.finalMessage;
$('#secret').textContent = CONFIG.secret;

/* ---------- Confetti ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W = 0, H = 0, parts = [], raf = null;
const COLORS = ['#FF6F9F', '#B7A0FF', '#FFDC6B', '#7FDCC0', '#FFFFFF', '#FF9F6B'];
function resize() {
  const r = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * r; cv.height = H * r;
  cx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', resize); resize();

function burst(x, y, n = 60, spread = Math.PI * 2, angle = -Math.PI / 2, power = 9) {
  if (reduce) n = Math.round(n / 3);
  for (let i = 0; i < n; i++) {
    const a = angle + (Math.random() - .5) * spread;
    const v = power * (.4 + Math.random());
    parts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4 + Math.random() * 5,
      c: COLORS[(Math.random() * COLORS.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
      life: 0, max: 90 + Math.random() * 60, round: Math.random() < .4
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life < p.max);
  for (const p of parts) {
    p.life++; p.vx *= .985; p.vy = p.vy * .985 + .25; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save();
    cx.globalAlpha = Math.min(1, (1 - p.life / p.max) * 2);
    cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.round) { cx.beginPath(); cx.arc(0, 0, p.r / 1.6, 0, 7); cx.fill(); }
    else cx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .6);
    cx.restore();
  }
  if (parts.length) raf = requestAnimationFrame(tick);
  else { cx.clearRect(0, 0, W, H); raf = null; }
}
function cannons() {
  burst(0, H, 80, .9, -1.05, 15);
  burst(W, H, 80, .9, -Math.PI + 1.05, 15);
}

/* ---------- Âm thanh (tạo bằng Web Audio, không cần file) ---------- */
let ac = null, soundOn = false, loopT = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, t0, d, type = 'triangle', vol = .12) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + d + .05);
}
const G4 = 392, A4 = 440, B4 = 494, C5 = 523, D5 = 587, E5 = 659, F5 = 698, G5 = 784;
const MELODY = [
  [G4,.75],[G4,.25],[A4,1],[G4,1],[C5,1],[B4,2],
  [G4,.75],[G4,.25],[A4,1],[G4,1],[D5,1],[C5,2],
  [G4,.75],[G4,.25],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1],
  [F5,.75],[F5,.25],[E5,1],[C5,1],[D5,1],[C5,2]
];
function playMelody() {
  const a = audio(); if (!a || !soundOn) return;
  let t = a.currentTime + .05; const beat = .42;
  for (const [f, b] of MELODY) { tone(f, t, b * beat * .95); t += b * beat; }
  loopT = setTimeout(playMelody, (t - a.currentTime) * 1000 + 700);
}
function sfx(kind) {
  if (!soundOn) return; const a = audio(); if (!a) return; const t = a.currentTime;
  if (kind === 'pop') { tone(520, t, .08, 'square', .07); tone(240, t + .02, .12, 'sawtooth', .05); }
  if (kind === 'light') tone(880, t, .15, 'sine', .08);
  if (kind === 'tada') [C5, E5, G5, 1047].forEach((f, i) => tone(f, t + i * .09, .3, 'triangle', .1));
}
$('#sound').addEventListener('click', e => {
  soundOn = !soundOn;
  e.currentTarget.setAttribute('aria-pressed', soundOn);
  e.currentTarget.textContent = soundOn ? '🔊 Tắt nhạc' : '🔈 Bật nhạc';
  clearTimeout(loopT);
  if (soundOn) playMelody();
});

/* ---------- Chuyển màn ---------- */
function go(n) {
  document.querySelectorAll('.stage').forEach(s => s.classList.toggle('active', s.id === 's' + n));
  scrollTo(0, 0);
  const h = document.querySelector('#s' + n + ' h1, #s' + n + ' h2');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

/* ---------- 1. Hộp quà ---------- */
const gift = $('#gift');
gift.addEventListener('click', () => {
  if (gift.classList.contains('open')) return;
  gift.classList.add('open');
  const r = gift.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + 40, 90, Math.PI * 1.3, -Math.PI / 2, 12);
  sfx('tada');
  setTimeout(() => go(2), 1300);
});

/* ---------- 2. Nến ---------- */
const NS = 'http://www.w3.org/2000/svg';
const CANDLE_X = [110, 135, 160, 185, 210];
const candleLayer = $('#candles');
let lit = 0;
CANDLE_X.forEach((x, i) => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'candle');
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  g.setAttribute('aria-label', 'Thắp nến số ' + (i + 1));
  g.innerHTML =
    '<rect x="' + (x - 13) + '" y="30" width="26" height="88" fill="transparent"/>' +
    '<rect class="ol" x="' + (x - 7) + '" y="72" width="14" height="44" rx="4" fill="' + (i % 2 ? '#7FDCC0' : '#FFDC6B') + '"/>' +
    '<line class="ol wick" x1="' + x + '" y1="72" x2="' + x + '" y2="62"/>' +
    '<g transform="translate(' + x + ' 58)"><path class="ol flame" style="stroke-width:3" d="M0,-18 C9,-7 10,3 0,9 C-10,3 -9,-7 0,-18Z" fill="#FF9F43"/></g>';
  const light = () => {
    if (g.classList.contains('lit')) return;
    g.classList.add('lit'); lit++; sfx('light');
    $('#count').textContent = 'Đã thắp ' + lit + '/5';
    if (lit === CANDLE_X.length) {
      $('#h2hint').textContent = 'Nhắm mắt lại, ước một điều thật đẹp nhé.';
      $('#blowbox').hidden = false;
    }
  };
  g.addEventListener('click', light);
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); light(); } });
  candleLayer.appendChild(g);
});

let blown = false;
function blow() {
  if (blown) return; blown = true;
  document.querySelectorAll('.candle').forEach(c => c.classList.remove('lit'));
  $('#blowbox').hidden = true;
  $('#count').textContent = 'Điều ước đã được gửi đi!';
  cannons(); sfx('tada');
  setTimeout(() => go(3), 1500);
}
$('#blow').addEventListener('click', blow);
$('#mic').addEventListener('click', async () => {
  const btn = $('#mic');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = mctx.createAnalyser(); an.fftSize = 512;
    mctx.createMediaStreamSource(stream).connect(an);
    const data = new Uint8Array(an.fftSize);
    btn.textContent = 'Đang nghe... thổi mạnh vào micro nhé';
    const loop = () => {
      an.getByteTimeDomainData(data);
      let sum = 0;
      for (const v of data) { const d = (v - 128) / 128; sum += d * d; }
      if (Math.sqrt(sum / data.length) > .22) {
        stream.getTracks().forEach(t => t.stop()); mctx.close(); blow(); return;
      }
      if (!blown) requestAnimationFrame(loop); else { stream.getTracks().forEach(t => t.stop()); }
    };
    loop();
  } catch (e) {
    btn.textContent = 'Không dùng được micro, bấm nút thổi nến nhé';
  }
});

/* ---------- 3. Bóng bay ---------- */
const BALLOONS = [
  { c: '#FF6F9F', x: 6, y: 34 }, { c: '#B7A0FF', x: 26, y: 70 }, { c: '#FFDC6B', x: 46, y: 24 },
  { c: '#7FDCC0', x: 66, y: 64 }, { c: '#FF9F6B', x: 84, y: 36 }
];
let popped = 0;
function buildBalloons() {
  const sky = $('#sky'); sky.innerHTML = ''; $('#wishes').innerHTML = '';
  popped = 0; $('#next').hidden = true;
  $('#h3hint').textContent = 'Chạm vào bóng bay để đọc lời chúc. Còn ' + BALLOONS.length + ' quả.';
  BALLOONS.forEach((b, i) => {
    const el = document.createElement('button');
    el.className = 'balloon'; el.textContent = '?';
    el.setAttribute('aria-label', 'Bóng bay số ' + (i + 1));
    el.style.cssText = 'left:calc(' + b.x + '% - 32px);top:' + b.y + 'px;background:' + b.c + ';animation-delay:' + (i * -.6) + 's';
    el.addEventListener('click', () => {
      if (el.classList.contains('popped')) return;
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 34, Math.PI * 2, -Math.PI / 2, 7);
      el.classList.add('popped'); sfx('pop'); popped++;
      const li = document.createElement('li');
      li.className = 'wish'; li.style.borderLeftColor = b.c;
      li.textContent = CONFIG.wishes[i % CONFIG.wishes.length];
      $('#wishes').prepend(li);
      const left = BALLOONS.length - popped;
      if (left === 0) {
        $('#h3hint').textContent = 'Đã mở hết lời chúc rồi!';
        $('#next').hidden = false; $('#next').focus({ preventScroll: true });
      } else {
        $('#h3hint').textContent = 'Còn ' + left + ' quả nữa.';
      }
    });
    sky.appendChild(el);
  });
}
buildBalloons();
$('#next').addEventListener('click', () => {
  go(4); cannons(); sfx('tada');
  setTimeout(cannons, 700); setTimeout(cannons, 1400);
});

/* ---------- 4. Thiệp cuối ---------- */
$('#again-confetti').addEventListener('click', () => { cannons(); sfx('tada'); });
let taps = 0;
$('#t4').addEventListener('click', () => {
  taps++;
  if (taps >= 5) { $('#secret').hidden = false; burst(innerWidth / 2, innerHeight / 3, 60); }
});
$('#restart').addEventListener('click', () => {
  gift.classList.remove('open');
  document.querySelectorAll('.candle').forEach(c => c.classList.remove('lit'));
  lit = 0; blown = false; taps = 0;
  $('#count').textContent = 'Đã thắp 0/5';
  $('#h2hint').textContent = 'Chạm vào từng cây nến để thắp lên.';
  $('#blowbox').hidden = true; $('#mic').textContent = 'hoặc thổi vào micro';
  $('#secret').hidden = true;
  buildBalloons(); go(1);
});
</script>
</body>
</html>
